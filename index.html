<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Mosaico do Oceano - Zapworks + A-Frame</title>

    <!-- 1. Importar a biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Importar o SDK Universal AR da Zapworks para A-Frame -->
    <script src="https://libs.zappar.com/zappar-aframe/2.0.0/zappar-aframe.js"></script>
  </head>
  <body>
    <!-- A cena A-Frame configurada com a integração da Zappar -->
    <a-scene embedded zappar-canvasswitch>

      <!-- Declaração de Ativos (Asset Management) -->
      <a-assets>
        <!-- Carregar o ficheiro de rastreio .zpt (Image Target do Mosaico) -->
        <a-asset-item id="target-mosaico" src="./mosaico.zpt"></a-asset-item>
      </a-assets>

      <!-- 3. Permissão e Controlo de Câmara do Zapworks -->
      <a-entity zappar-permissions-ui id="permissions"></a-entity>
      <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

      <!-- Câmara de AR fornecida pela Zappar -->
      <a-entity camera zappar-camera></a-entity>

      <!-- 4. Âncora de Rastreio de Imagem (Image Target) -->
      <!-- Tudo dentro deste nó fica fixo sobre o Mosaico quando detetado pela câmara -->
      <a-entity zappar-image="target: #target-mosaico">

        <!-- Exemplo de Conteúdo 3D sobreposto ao mosaico -->
        
        <!-- Cubo translúcido de teste -->
        <a-box position="0 0.5 0" 
               rotation="0 45 0" 
               scale="0.8 0.8 0.8" 
               material="color: #4CC3D9; opacity: 0.85;">
        </a-box>

        <!-- Anel / Moldura decorativa -->
        <a-ring position="0 0.01 0" 
                rotation="-90 0 0" 
                radius-inner="0.6" 
                radius-outer="0.8" 
                color="#FFC65D">
        </a-ring>

      </a-entity>

    </a-scene>
  </body>
</html>
