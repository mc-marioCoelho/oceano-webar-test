<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Restauro da Barba do Oceano</title>

    <!-- Versões perfeitamente compatíveis do A-Frame e Zappar SDK -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://libs.zappar.com/zappar-aframe/2.0.0/zappar-aframe.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      #instructions-overlay {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 25px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <div id="instructions-overlay">
      Aponte a câmara para a máscara do Deus Oceano
    </div>

    <!-- Cena A-Frame Zappar -->
    <a-scene embedded vr-mode-ui="enabled: false">

      <a-assets>
        <img id="barba-png" src="./lacuna-barba.png" crossorigin="anonymous">
      </a-assets>

      <a-entity zappar-permissions-ui id="permissions"></a-entity>
      <a-entity zappar-compatibility-ui id="compatibility"></a-entity>
      
      <a-entity camera zappar-camera></a-entity>

      <!-- Ficheiro ZPT gerado no Colab -->
      <a-entity zappar-image="target: ./mascara_oceano.zpt">

        <a-plane position="0 0 0.005" 
                 rotation="0 0 0" 
                 width="1" 
                 height="1" 
                 src="#barba-png" 
                 material="transparent: true; opacity: 1.0; alphaTest: 0.5; depthTest: true;">
        </a-plane>

      </a-entity>

    </a-scene>

  </body>
</html>
