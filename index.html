<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Mosaico do Oceano - Zapworks + A-Frame</title>

    <!-- 1. Importar A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- 2. Importar o SDK Universal AR da Zapworks para A-Frame -->
    <script src="https://libs.zappar.com/zappar-aframe/2.0.0/zappar-aframe.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- A-Scene limpa a ocupar 100% do ecrã -->
    <a-scene zappar-canvasswitch>

      <!-- 3. Permissão e Controlo de Câmara -->
      <a-entity zappar-permissions-ui id="permissions"></a-entity>
      <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

      <!-- Câmara de AR Zappar -->
      <a-entity camera zappar-camera></a-entity>

      <!-- 4. Âncora de Rastreio com o caminho direto para mosaico.zpt -->
      <a-entity zappar-image="target: ./mosaico.zpt">

        <!-- Cubo translúcido de teste -->
      <a-box position="0 0.1 0" 
               rotation="0 45 0" 
               scale="0.2 0.2 0.2" 
               material="color: #4CC3D9; opacity: 0.85;">
      </a-box>

        <!-- Anel decorativo -->
       <a-ring position="0 0.01 0" 
               rotation="-90 0 0" 
               radius-inner="0.2" 
               radius-outer="0.3" 
               color="#FFC65D">
      </a-ring>

      </a-entity>

    </a-scene>
  </body>
</html>
