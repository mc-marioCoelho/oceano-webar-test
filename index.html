<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR - Restauro da Barba do Oceano</title>

    <!-- A-Frame & Zappar SDK -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://libs.zappar.com/zappar-aframe/2.0.0/zappar-aframe.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* Mensagem de instrução no ecrã */
      #instructions-overlay {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 24px;
        border-radius: 25px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <!-- Interface com instruções -->
    <div id="instructions-overlay">
      Aponte a câmara para a máscara do Deus Oceano
    </div>

    <!-- Cena A-Frame com Zappar (Sem modo VR) -->
    <a-scene embedded vr-mode-ui="enabled: false" zappar-canvasswitch>

      <a-assets>
        <!-- Ficheiro PNG com transparência da recomposição da barba -->
        <img id="barba-png" src="./lacuna-barba.png" crossorigin="anonymous">
      </a-assets>

      <!-- Interfaces de permissão e compatibilidade do Zappar -->
      <a-entity zappar-permissions-ui id="permissions"></a-entity>
      <a-entity zappar-compatibility-ui id="compatibility"></a-entity>
      
      <!-- Câmara WebAR do Zappar -->
      <a-entity camera zappar-camera></a-entity>

      <!-- Rastreio do Ficheiro .ZPT gerado no Colab -->
      <a-entity zappar-image="target: ./mascara_oceano.zpt">

        <!-- 
          Plano 2D em RA com a reconstituição da barba.
          position="0 0 0.005" eleva ligeiramente para evitar flutuação/cintilação (z-fighting).
        -->
        <a-plane position="0 0 0.005" 
                 rotation="0 0 0" 
                 width="1" 
                 height="1" 
                 src="#barba-png" 
                 material="transparent: true; opacity: 1.0; alphaTest: 0.5; depthTest: true;">
        </a-plane>

      </a-entity>

    </a-scene>

  </body>
</html>
